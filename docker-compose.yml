version: '3.8'

services:
  server:
    build: ./server
    environment:
      PORT: '3001'
      DB_PATH: /data/users.db
    volumes:
      - db_data:/data
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3001/api/facets']
      interval: 10s
      timeout: 5s
      retries: 5

  client:
    build:
      context: ./client
      args:
        BACKEND_URL: http://server:3001
    ports:
      - '3000:3000'
    environment:
      HOSTNAME: '0.0.0.0'
    depends_on:
      server:
        condition: service_healthy

volumes:
  db_data:
